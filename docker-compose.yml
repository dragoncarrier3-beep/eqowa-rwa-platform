services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eqowa
      POSTGRES_PASSWORD: eqowa
      POSTGRES_DB: eqowa
    ports:
      - '5432:5432'
    volumes:
      - eqowa-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eqowa -d eqowa']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eqowa-pg:
