name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a branch cancels any run still in progress for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Lint first-party Solidity
        # contracts/trex is vendored upstream and deliberately excluded via
        # .solhintignore, so only our own modules are linted here.
        run: npm run lint:sol

      - name: Run tests
        run: npx hardhat test

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Run API tests
        run: npm run api:test

      - name: Lifecycle simulation on a local chain
        # Deploys the suite and escrow with the production scripts onto a
        # Hardhat node and runs the whole payment-to-mint lifecycle.
        run: npm run simulate:local

  web:
    name: Web app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Lint
        run: npm run web:lint

      - name: Typecheck
        run: npm run web:typecheck

      - name: Run web tests
        run: npm run web:test

      - name: Production build
        run: npm run web:build
